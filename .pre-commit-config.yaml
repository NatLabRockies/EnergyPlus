exclude: |
  (?x)(
      ^bin/.*                    # bin/ at repo root
    | ^third_party/.*            # third_party/ at repo root
    | .*\.(bat|BAT|dat|gtp)$     # .bat and a few similar
    | .*\.(epw|stat|audit)$      # EnergyPlus specific files
  )
fail_fast: false
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
    # We exclude these because ddy/epw are treated as immutable, and the idf/imf etc are formatted by Transition tool probably
    exclude: '.*\.(idf|imf|rvi|mvi|epw|ddy)$'
  - id: check-merge-conflict
  - id: check-yaml
  - id: fix-byte-order-marker

- repo: https://github.com/psf/black
  rev: 25.9.0
  hooks:
  - id: black

- repo: https://github.com/pycqa/isort
  rev: 6.1.0
  hooks:
  - id: isort

- repo: local
  hooks:
#  - id: test-hook
#    name:  test-hook
#    entry: python3 scripts/dev/test_hook.py
#    args: ['--verbose'] #, '--gha']
#    language: system
#    files: '.*\.cc'
#    pass_filenames: true
#    # I am handling concurrency in the script. Note that if you run with --all-files and do not add a filter, it might run twice or more, because of limitation in SC_ARG_MAX
#    # (The maximum length of all arguments and environment strings to exec())
#    # Passing about 2500 relative paths exceeds the limit so it MUST break it down in chunks anyways
#    require_serial: true

  - id: check-constexpr
    name: Check Constexpr Usage
    entry: python3 scripts/dev/check_constexpr.py
    args: ['--verbose']
    language: system
    files: '^src/EnergyPlus/.*\.(cc|hh)$|^tst/EnergyPlus/unit/.*\.(cc|hh)$'
    pass_filenames: true
    require_serial: true

  - id: validate-idd-units
    name: Validate IDD units
    entry: python3 scripts/dev/validate_idd_units.py
    args: ['--verbose']
    language: system
    files: '.*\.idd.in$'  # The old IDDs will not issue a ton of warnings
    pass_filenames: true
    require_serial: true

  - id: verify-idfs-in-cmake
    name: Verify IDFs in testfiles CMake
    entry: python3 scripts/dev/verify_idfs_in_cmake.py
    args: ['--verbose']
    language: system
    files: '^testfiles/.*\.(idf|imf)$|^testfiles/CMakeLists\.txt$'
    pass_filenames: true
    require_serial: true

  - id: check-non-utf8
    name: Check files are UTF-8
    entry: python3 scripts/dev/check_non_utf8.py
    language: system
    args: ['--fix', '--verbose']
    pass_filenames: true
    require_serial: true

  - id: verify-cmake-dirs
    name: verify_cmake_dirs
    entry: python3 scripts/dev/verify_cmake_dirs.py
    args: ['--verbose']
    language: system
    files: "^testfiles/.*"
    pass_filenames: false
