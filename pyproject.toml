[tool.flake8]
extend-ignore = [
    "E203", # Whitespace before ":" - sometimes this is helpful, as in df.loc[a : b]
    "E501", # line too long: black will autofix this where possible
]

[tool.black]
line-length = 120
target-version = ['py312']
exclude = '''
(
  ^/bin/.*                    # bin/ at repo root
  | ^/third_party/.*          # third_party/ at repo root
)
'''

[tool.isort]
line_length = 120
profile = "black"
skip = ["bin", "third_party"]

[tool.nbqa.addopts]
flake8 = [
    "--ignore=E402,W503,W504,B007"  # module level import not at top of file
]
