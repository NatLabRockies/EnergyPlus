name: Self-Hosted Build and Test

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to test (leave empty for current ref)"
        required: false
        default: ""

jobs:
  build_and_test:
    name: Build and Test (Ubuntu matrix)
    strategy:
      fail-fast: false
      matrix:
        runner:
          - [self-hosted, linux, x64, ubuntu-24.04]
          - [self-hosted, linux, x64, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout EnergyPlus
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DBUILD_PACKAGE=OFF
          -DBUILD_FORTRAN=ON
          -DDOCUMENTATION_BUILD=DoNotBuild
          -DLINK_WITH_PYTHON=ON
          -DPYTHON_CLI=ON
          -DPython_REQUIRED_VERSION:STRING=${{ steps.setup-python.outputs.python-version }}
          -DPython_ROOT_DIR:PATH="$(dirname "$(dirname "${{ steps.setup-python.outputs.python-path }}")")"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run tests
        run: ctest --test-dir build -j "$(nproc)" --label-exclude slow --output-on-failure
