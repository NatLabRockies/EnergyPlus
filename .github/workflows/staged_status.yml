name: Staged status

# Posts a "PR ran through Static Analysis" commit status on every PR commit:
#   - pending  while the PR does not carry the "Staged" label (blocks merging if the status is required,
#              but shows a yellow dot rather than a red X)
#   - success  once the PR is "Staged"; the actual analysis result is the separate "Static analysis" check
#
# pull_request_target gives a write token even for PRs from forks. This is safe because this workflow never
# checks out or runs any PR code: it only reads the label list and calls the API.
# NOTE: the workflow file is read from the base branch, so it must be on main to take effect.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  statuses: write

jobs:
  staged:
    name: Post Staged status
    runs-on: ubuntu-24.04
    steps:
    - name: Post commit status
      env:
        GH_TOKEN: ${{ github.token }}
        STAGED: ${{ contains(github.event.pull_request.labels.*.name, 'Staged') }}
        SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "$STAGED" = "true" ]; then
          state=success
          description="Staged"
        else
          state=pending
          description="Waiting for the Staged label"
        fi
        gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
          -f state="${state}" \
          -f context="PR ran through Static Analysis" \
          -f description="${description}" \
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
